name: Build executables with Nuitka

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ patchelf python3-tk

      - name: Compile Edgy with Nuitka
        shell: bash
        run: |
          echo "Compiling Edgy on ${{ matrix.os }}..."
      
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            python -m nuitka main.py \
              --standalone \
              --macos-create-app-bundle \
              --macos-app-icon=assets/logo.icns \
              --enable-plugin=tk-inter \
              --assume-yes-for-downloads \
              --include-data-dir=assets=assets \
              --include-data-files=logic_config.json=logic_config.json \
              --output-dir=build \
              --output-filename=Edgy
      
          else
            python -m nuitka main.py \
              --standalone \
              --onefile \
              --enable-plugin=tk-inter \
              --assume-yes-for-downloads \
              --include-data-dir=assets=assets \
              --include-data-files=logic_config.json=logic_config.json \
              --output-dir=build \
              --output-filename=Edgy \
              ${{ matrix.os == 'windows-latest' && '--windows-icon-from-ico=assets/logo.ico --windows-console-mode=disable' || '' }}
          fi

      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: Edgy-${{ matrix.os }}
          path: build/





