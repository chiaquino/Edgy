name: Build executables with Nuitka

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Target Intel x86_64 macOS architecture
        os: [macos-15-intel, windows-latest]
        #os: [windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ patchelf python3-tk

      # Build for Windows / Linux
      - name: Compile Edgy with Nuitka (Windows / Linux)
        if: matrix.os != 'macos-15-intel'
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXTRA_FLAGS="--windows-icon-from-ico=assets/logo.ico --windows-console-mode=disable --onefile-windows-splash-screen-image=assets/logo.png"
          fi

          python -m nuitka main.py \
            --standalone \
            --onefile \
            --enable-plugin=tk-inter \
            --assume-yes-for-downloads \
            --include-data-dir=assets=assets \
            --include-data-files=logic_config.json=logic_config.json \
            --output-dir=build \
            --output-filename=Edgy \
            $EXTRA_FLAGS

      # Build for macOS (Targeting x86_64 Intel)
      - name: Compile Edgy with Nuitka (macOS x86_64)
        if: matrix.os == 'macos-15-intel'
        run: |
          export MACOSX_DEPLOYMENT_TARGET=12.0
          python -m nuitka main.py \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-name=Edgy \
            --macos-target-arch=x86_64 \
            --macos-app-icon=assets/logo.png \
            --enable-plugin=tk-inter \
            --assume-yes-for-downloads \
            --include-data-dir=assets=assets \
            --include-data-files=logic_config.json=logic_config.json \
            --output-dir=build \
            --output-filename=Edgy

      # Zip macOS .app bundle to keep executable permissions intact
      - name: Zip macOS Bundle
        if: matrix.os == 'macos-15-intel'
        run: |
          cd build
          APP=$(find . -maxdepth 1 -name "*.app" | head -n 1)
      
          if [ -z "$APP" ]; then
            echo "No .app bundle found!"
            ls -la
            exit 1
          fi
      
          zip -r Edgy-macOS-x86_64.zip "$APP"

      - name: Upload Built Executable
        uses: actions/upload-artifact@v4
        with:
          name: Edgy-${{ matrix.os }}
          path: |
            build/Edgy-macOS-x86_64.zip
            build/*.exe

