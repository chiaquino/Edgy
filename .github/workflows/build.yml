name: Build executables with Nuitka

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nuitka

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ patchelf python3-tk

      # Build for Windows / Linux (Using --onefile)
      - name: Compile Edgy with Nuitka (Windows / Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          EXTRA_FLAGS=""
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            EXTRA_FLAGS="--windows-icon-from-ico=assets/logo.ico --windows-console-mode=disable"
          fi

          python -m nuitka main.py \
            --standalone \
            --onefile \
            --enable-plugin=tk-inter \
            --assume-yes-for-downloads \
            --include-data-dir=assets=assets \
            --include-data-files=logic_config.json=logic_config.json \
            --output-dir=build \
            --output-filename=Edgy \
            $EXTRA_FLAGS

      # Build for macOS (Creates proper .app bundle)
      - name: Compile Edgy with Nuitka (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          python -m nuitka main.py \
            --standalone \
            --macos-create-app-bundle \
            --macos-app-icon=assets/logo.icns \
            --enable-plugin=tk-inter \
            --assume-yes-for-downloads \
            --include-data-dir=assets=assets \
            --include-data-files=logic_config.json=logic_config.json \
            --output-dir=build \
            --output-filename=Edgy

      - name: Upload built executable
        uses: actions/upload-artifact@v4
        with:
          name: Edgy-${{ matrix.os }}
          path: build



